[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-universal"
version = "0.1.1"
description = "Cross-platform Laya typed decision inference — ONNX Runtime (Windows/Linux/macOS) + MLX (Apple Silicon)"
keywords = ["laya", "typed-decisions", "decision-model", "local-ai", "onnx", "inference", "cross-platform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "abusuraihsakhri", email = "abusuraihsakhri@gmail.com" }
]
dependencies = [
    "numpy>=1.26",
    "huggingface-hub>=0.34,<2",
    "tokenizers>=0.21,<1",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
mlx = ["mlx>=0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11'"]
gpu-cuda = ["onnxruntime-gpu>=1.18"]
gpu-directml = ["onnxruntime-directml>=1.18"]
export = ["laya>=0.3.5"]
demo = ["rich>=15,<16", "Pillow>=12,<13"]
dev = ["pytest>=8", "ruff>=0.12", "build>=1"]

[project.scripts]
laya-universal = "laya_universal.cli:main"

[project.urls]
Homepage = "https://abusuraihsakhri.github.io/laya-universal/"
Documentation = "https://abusuraihsakhri.github.io/laya-universal/"
Repository = "https://github.com/abusuraihsakhri/laya-universal"
"Issue Tracker" = "https://github.com/abusuraihsakhri/laya-universal/issues"
Upstream = "https://github.com/NandhaKishorM/laya"
"MLX port" = "https://github.com/mizorewww/laya-mlx"

[tool.hatch.build.targets.wheel]
packages = ["laya_universal"]

[tool.hatch.build.targets.sdist]
include = ["/laya_universal", "/tests", "/pyproject.toml", "/README.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
